[service]
name             = "deku-pay"
slot             = "payments"
kind             = "build"       # IN-HOUSE: not a public image -- built from build/
build            = "build"       # build context dir (Dockerfile + app.py) in this provider dir
host             = "deku-pay"
port             = 8080
healthcheck_path = "/health"
app_env_hint     = "PAYMENTS_SECRET_KEY / PAYMENTS_PUBLISHABLE_KEY"
asset            = "deku-pay"    # compose.py copies build/ into the task as environment/deku-pay/
