  # deku-pay: in-house adversarial payment provider (PLAN.md 3.3.1).
  # Built from the deku-pay/ build context -- no external image registry required.
  # environment/compose.py copies the central build context into the task's
  # environment/deku-pay/ (asset) so this relative `context:` resolves.
  deku-pay:
    build:
      context: ./deku-pay
    restart: unless-stopped
    environment:
      PAYMENTS_SECRET_KEY: sk_local_deku
      PAYMENTS_PUBLISHABLE_KEY: pk_local_deku
      PAYMENTS_WEBHOOK_SECRET: wh_local_deku
      DEKU_SETTLE_DELAY: "2"
    healthcheck:
      # python stdlib urlopen -- no curl/wget dependency in the slim image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
