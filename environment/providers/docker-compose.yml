# One independent container per mock service. Each builds from this directory so
# the shared plane (_mutable_store / tracking_middleware / admin_plane) is in
# context, and each is reachable from the others at http://<name>-api:<port>.
#
#   docker compose up -d supabase-api
#   curl http://localhost:8102/health
services:
  supabase-api:
    build:
      context: .
      dockerfile: supabase-api/Dockerfile
    image: mocks-supabase-api:v1
    container_name: supabase-api
    ports:
      - "8102:8102"
    environment:
      SUPABASE_API_URL: http://supabase-api:8102
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  pocketbase-api:
    build:
