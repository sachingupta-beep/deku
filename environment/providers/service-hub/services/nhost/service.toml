# Service Hub manifest -- catalog entry only.
#
# status = "declared" means the hub advertises this service in /hub/services and
# /hub/catalog, but calling it returns 501 with a pointer at the authoring guide.
# That is deliberate: a declared service is an honest "not built yet", never a
# stub that answers 200 with invented data. Flip it to "implemented" in the same
# commit that adds the module -- see docs/SERVICE_AUTHORING.md.

[service]
slug     = "nhost"
name     = "Nhost"
category = "backend"
status   = "declared"
version  = "v1"
module   = "services.nhost.service:NhostService"
upstream = "https://docs.nhost.io/reference"
summary  = """
Hasura-backed BaaS: a GraphQL endpoint with role-scoped permissions, auth, storage with presigned URLs and serverless functions."""
tags = [
  "graphql",
  "hasura",
  "storage",
  "functions",
  "jwt",
]

[data]
dir = "nhost"

[auth]
scheme      = "bearer"
roles       = [
  "public",
  "user",
  "admin",
]
description = """
`Authorization: Bearer <jwt>`. Hasura role claims decide row access; `x-hasura-admin-secret` bypasses them the way the real stack does."""

[health]
path = "/health"

[routes]
prefixes = [
  "/v1/graphql",
  "/v1/auth",
  "/v1/storage",
  "/v1/functions",
  "/v1/healthz",
]
