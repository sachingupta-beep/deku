# Service Hub manifest -- catalog entry only.
#
# status = "declared" means the hub advertises this service in /hub/services and
# /hub/catalog, but calling it returns 501 with a pointer at the authoring guide.
# That is deliberate: a declared service is an honest "not built yet", never a
# stub that answers 200 with invented data. Flip it to "implemented" in the same
# commit that adds the module -- see docs/SERVICE_AUTHORING.md.

[service]
slug     = "pocketbase"
name     = "PocketBase"
category = "backend"
status   = "declared"
version  = "v1"
module   = "services.pocketbase.service:PocketbaseService"
upstream = "https://pocketbase.io/docs/api-records/"
summary  = """
Single-file Go backend: collections with per-collection API rules, record CRUD with expand, file attachments and the admin settings surface."""
tags = [
  "collections",
  "records",
  "sqlite",
  "realtime",
  "files",
]

[data]
dir = "pocketbase"

[auth]
scheme      = "token"
roles       = [
  "guest",
  "user",
  "admin",
]
description = """
`Authorization: <token>` (no Bearer prefix, as PocketBase expects). Admin tokens unlock /api/admins and the settings routes; record tokens are scoped to their collection's API rules."""

[health]
path = "/health"

[routes]
prefixes = [
  "/api/collections",
  "/api/collections/{collection}/records",
  "/api/files",
  "/api/settings",
  "/api/backups",
  "/api/logs",
]
