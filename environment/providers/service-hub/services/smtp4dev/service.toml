# Service Hub manifest -- catalog entry only.
#
# status = "declared" means the hub advertises this service in /hub/services and
# /hub/catalog, but calling it returns 501 with a pointer at the authoring guide.
# That is deliberate: a declared service is an honest "not built yet", never a
# stub that answers 200 with invented data. Flip it to "implemented" in the same
# commit that adds the module -- see docs/SERVICE_AUTHORING.md.

[service]
slug     = "smtp4dev"
name     = "smtp4dev"
category = "email"
status   = "declared"
version  = "v1"
module   = "services.smtp4dev.service:Smtp4devService"
upstream = "https://github.com/rnwood/smtp4dev/wiki"
summary  = """
.NET SMTP catcher: paged result envelopes, MIME parts as a navigable tree, and SMTP sessions stored separately from the messages they delivered."""
tags = [
  "paging",
  "mime-tree",
  "sessions",
  "retention",
]

[data]
dir = "smtp4dev"

[auth]
scheme      = "none"
roles       = []
description = """
No authentication. The API is ASP.NET-shaped: paged envelopes with rowCount/pageCount rather than bare arrays."""

[health]
path = "/health"

[routes]
prefixes = [
  "/api/Messages",
  "/api/Messages/{id}/part",
  "/api/Sessions",
  "/api/Server",
  "/api/Mailboxes",
  "/api/Version",
]
