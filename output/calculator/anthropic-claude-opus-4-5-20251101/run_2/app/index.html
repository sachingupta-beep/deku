<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deku Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            display: flex;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .calculator {
            background: #0f0f23;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: 320px;
        }
        
        .display {
            background: #1a1a3e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 100px;
        }
        
        .expression {
            color: #888;
            font-size: 16px;
            min-height: 24px;
            word-break: break-all;
        }
        
        .result {
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            text-align: right;
            min-height: 44px;
            word-break: break-all;
        }
        
        .error {
            background: #ff4444;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        
        .error.visible {
            display: block;
        }
        
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .btn {
            background: #1a1a3e;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #2a2a5e;
            transform: scale(1.05);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn.operator {
            background: #4a4a8e;
        }
        
        .btn.operator:hover {
            background: #5a5a9e;
        }
        
        .btn.equals {
            background: #00d4aa;
            color: #000;
        }
        
        .btn.equals:hover {
            background: #00e4ba;
        }
        
        .btn.clear {
            background: #ff6b6b;
        }
        
        .btn.clear:hover {
            background: #ff7b7b;
        }
        
        .history-panel {
            background: #0f0f23;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: 320px;
            max-height: 500px;
            display: flex;
            flex-direction: column;
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .history-header h2 {
            color: #fff;
            font-size: 18px;
        }
        
        .clear-history {
            background: #ff6b6b;
            border: none;
            border-radius: 8px;
            color: #fff;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .clear-history:hover {
            background: #ff7b7b;
        }
        
        .history-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #4a4a8e #1a1a3e;
        }
        
        .history-list::-webkit-scrollbar {
            width: 8px;
        }
        
        .history-list::-webkit-scrollbar-track {
            background: #1a1a3e;
            border-radius: 4px;
        }
        
        .history-list::-webkit-scrollbar-thumb {
            background: #4a4a8e;
            border-radius: 4px;
        }
        
        .history-item {
            background: #1a1a3e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        
        .history-expression {
            color: #888;
            font-size: 14px;
            word-break: break-all;
        }
        
        .history-result {
            color: #00d4aa;
            font-size: 20px;
            font-weight: bold;
            text-align: right;
        }
        
        .empty-history {
            color: #666;
            text-align: center;
            padding: 40px 20px;
        }
        
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display">
                <div class="expression" id="expression"></div>
                <div class="result" id="result">0</div>
            </div>
            <div class="error" id="error"></div>
            <div class="keypad">
                <button class="btn clear" onclick="clearAll()">C</button>
                <button class="btn operator" onclick="append('(')">(</button>
                <button class="btn operator" onclick="append(')')">)</button>
                <button class="btn operator" onclick="append('/')">÷</button>
                
                <button class="btn" onclick="append('7')">7</button>
                <button class="btn" onclick="append('8')">8</button>
                <button class="btn" onclick="append('9')">9</button>
                <button class="btn operator" onclick="append('*')">×</button>
                
                <button class="btn" onclick="append('4')">4</button>
                <button class="btn" onclick="append('5')">5</button>
                <button class="btn" onclick="append('6')">6</button>
                <button class="btn operator" onclick="append('-')">−</button>
                
                <button class="btn" onclick="append('1')">1</button>
                <button class="btn" onclick="append('2')">2</button>
                <button class="btn" onclick="append('3')">3</button>
                <button class="btn operator" onclick="append('+')">+</button>
                
                <button class="btn" onclick="append('0')">0</button>
                <button class="btn" onclick="append('.')">.</button>
                <button class="btn" onclick="backspace()">⌫</button>
                <button class="btn equals" onclick="calculate()">=</button>
            </div>
        </div>
        
        <div class="history-panel">
            <div class="history-header">
                <h2>History</h2>
                <button class="clear-history" onclick="clearHistory()">Clear</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="empty-history">No calculations yet</div>
            </div>
        </div>
    </div>
    
    <script>
        let currentExpression = '';
        let lastResult = null;
        
        function updateDisplay() {
            document.getElementById('expression').textContent = currentExpression || '';
            if (lastResult !== null) {
                document.getElementById('result').textContent = lastResult;
            } else if (currentExpression === '') {
                document.getElementById('result').textContent = '0';
            }
        }
        
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('visible');
            document.getElementById('result').textContent = '—';
            lastResult = null;
        }
        
        function hideError() {
            document.getElementById('error').classList.remove('visible');
        }
        
        function append(char) {
            hideError();
            currentExpression += char;
            lastResult = null;
            updateDisplay();
        }
        
        function clearAll() {
            hideError();
            currentExpression = '';
            lastResult = null;
            updateDisplay();
        }
        
        function backspace() {
            hideError();
            currentExpression = currentExpression.slice(0, -1);
            lastResult = null;
            updateDisplay();
        }
        
        async function calculate() {
            if (!currentExpression.trim()) {
                showError('Please enter an expression');
                return;
            }
            
            hideError();
            
            try {
                const response = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ expression: currentExpression })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    showError(data.error || 'Calculation failed');
                    return;
                }
                
                lastResult = data.result;
                document.getElementById('result').textContent = lastResult;
                loadHistory();
            } catch (err) {
                showError('Network error');
            }
        }
        
        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                const data = await response.json();
                
                const listEl = document.getElementById('historyList');
                
                if (data.entries.length === 0) {
                    listEl.innerHTML = '<div class="empty-history">No calculations yet</div>';
                    return;
                }
                
                listEl.innerHTML = data.entries.map(entry => `
                    <div class="history-item">
                        <div class="history-expression">${escapeHtml(entry.expression)}</div>
                        <div class="history-result">= ${entry.result}</div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load history:', err);
            }
        }
        
        async function clearHistory() {
            try {
                await fetch('/api/history', { method: 'DELETE' });
                loadHistory();
            } catch (err) {
                console.error('Failed to clear history:', err);
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') append(e.key);
            else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') append(e.key);
            else if (e.key === '(' || e.key === ')') append(e.key);
            else if (e.key === '.') append('.');
            else if (e.key === 'Enter' || e.key === '=') calculate();
            else if (e.key === 'Escape') clearAll();
            else if (e.key === 'Backspace') backspace();
        });
        
        // Load history on page load
        loadHistory();
    </script>
</body>
</html>
