# GENERATED by environment/compose.py from the central service catalog.
# Do NOT edit by hand -- edit environment/providers/<provider>/ and regenerate.
# Task-specific seed (pocketbase-init.sh, keycloak-realm.json) stays in this folder.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deku_admin
      POSTGRES_PASSWORD: deku-local-dev
      POSTGRES_DB: ethara
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deku_admin -d ethara"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Mailpit is a real SMTP server with an HTTP inbox API -- not a stub. The
  # agent sends confirmation emails over SMTP on 1025; the verifier reads the
  # inbox at the HTTP API on 8025 via EMAIL_INBOX_API_URL. Pinned to a specific
  # version tag for reproducibility; `latest` would silently break on API changes.
  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      # No auth required for local fixture use -- the agent sends unauthenticated
      # SMTP and the verifier reads the inbox without credentials.
      MP_MAX_MESSAGES: "500"
    ports:
      - "1025:1025"   # SMTP -- agent sends here
      - "8025:8025"   # HTTP API/UI -- verifier inspects here
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/messages > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # A Docker daemon for the AGENT ONLY, so it can test the /app/Dockerfile the
  # deployment contract asks for. Without it the agent writes the build recipe
  # blind and only learns it is broken at grading time, which measures nothing
  # useful: a typo and an inability to package score the same.
  #
  # NESTED, not the host daemon. Mounting /var/run/docker.sock would be one line,
  # but it hands the agent the host daemon -- and from there `docker run -v /:/host`
  # reads the task's own tests/ directory off the host filesystem. That is the
  # answer key. This is a separate daemon inside its own container: verified
  # 2026-08-10 that `docker ps -a` through it returns nothing at all.
  #
  # eval_fresh.py does NOT start this during grading (AGENT_ONLY_SERVICES) -- the
  # graded image is built by the harness, never by the agent.
  dockerd:
    image: docker:27-dind
    privileged: true          # a daemon needs its own mounts, cgroups and netns
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""  # plaintext on the internal network; no certs to mint
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]

  # Harbor's agent container. Ports only -- Harbor merges this file LAST and
  # controls image/build/env. Never add image/command/profiles here.
  main:
    ports:
      - "4173:4173"
