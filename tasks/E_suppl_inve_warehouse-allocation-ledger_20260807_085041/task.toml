# Corpus is pinned to 1.3; validate_task.py rejects anything else so a task
# cannot silently use fields the rest of the harness does not read.
schema_version = "1.3"

[task]
name        = "ethara/warehouse-allocation-ledger"
version     = "1.0.0"
description = "Warehouse allocation ledger: planners reserve pallets from a shared pool, a stock admin adjusts on-hand counts, every movement appends an immutable ledger line, and an oversell is refused by a database constraint that names the quantity still free"
authors     = []
keywords    = ["greenfield", "enterprise", "typescript", "postgres", "inventory-allocation", "supply-chain-inventory"]

# ---------------------------------------------------------------------------
# Deku metadata. Harbor treats [metadata] as arbitrary, so this block carries
# BOTH shapes (D-C, resolved): `category` is the Harbor-facing constant that
# PLAN.md 4.1 and all six shipped reference tasks use, and `sub_category` carries
# the real TAXONOMY level-1 value that T1-T3 read.
# ---------------------------------------------------------------------------
[metadata]
category        = "Greenfield"
sub_category    = "enterprise"
domain          = "supply-chain-inventory"
pattern         = "inventory-allocation"
archetype       = "warehouse-allocation-ledger"
variant         = "a"
variant_axes    = []
service_profile = "P1-db"

task_code      = "E_suppl_inve_warehouse-allocation-ledger_20260807_085041"
naming_scheme  = "task-code-v1"
grader_version = "0.20.0"
language       = "typescript"

# Variant `a` withholds nothing: all ten instruction sections are supplied, so
# the difficulty sits entirely in the concurrency requirement rather than in a
# missing section. The b/c/d rungs are where a section gets withheld.
spec_sections_given = [
  "overview",
  "roles",
  "features",
  "flow",
  "uiux",
  "techrequirements",
  "datamodel",
  "constraints",
  "contract",
  "buildplan",
]

# The `hard` band of the documented budget table. The task is a single-provider
# CRUD surface with one genuinely hard property behind it: a reservation route
# that has to be correct under two simultaneous requests, held by a database
# constraint rather than by application code. That property is where the budget
# goes, and it is why this sits at `hard` rather than at `medium`.
turns_expected  = 170
tokens_expected = 7000000
contributor_id  = "<contributor-id>"
created_at      = "2026-08-07"
canary_present  = true

# Calibration record. Written by the Calibration Engineer, never by the author,
# and therefore present and empty here.
reference_model_used = ""
# The author's own budget note above places this in the `hard` band: a single
# provider, but with a reservation route that must hold under two simultaneous
# requests via a database constraint. Provisional until calibration trials run.
difficulty           = "hard"
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
calibration_date     = ""
openhands_version    = ""
harbor_version       = "0.20.0"

# Slot set for profile P1-db. `backend` is the normalised name of the `db` slot,
# and it is the pattern's only mandatory slot (reference B.1). The realtime slot
# was considered for the live board and deliberately not declared: the pinned
# grader ships no realtime capability adapter, so declaring it would have bought
# a provider no assertion could reach in exchange for a guaranteed G32 UNMET.
# The live board is specified as an observable and graded by the browser channel.
#
# The database is this task's anti-gaming surface. A browser cannot tell a
# reservation route that is safe under contention from one that is not, and a
# cached free counter looks identical on screen to a derived one. The verifier
# reads postgres directly and fires simultaneous requests at one row.
[metadata.services]
backend = "postgres"

# ---------------------------------------------------------------------------
# Agent phase
# ---------------------------------------------------------------------------
[agent]
timeout_sec = 18000.0

# ---------------------------------------------------------------------------
# Agent environment. Agent-visible surface only: no admin, inbox or service-role
# credential appears here (INV4, gated by G17).
# ---------------------------------------------------------------------------
[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0

# Egress is build-time only. Postgres is a sidecar on the internal network and is
# not reached through this allowlist. Flip to "no-network" once the warm package
# cache lands.
# LOCAL-DEV SETTING -- revert to "allowlist" before this task is admitted.
# Docker Desktop's LinuxKit kernel lacks CONFIG_NFT_FIB_INET, so Harbor cannot
# enforce any non-public policy and rejects the task outright. The allowed_hosts
# list below is kept commented for a mechanical revert.
network_mode  = "public"
# allowed_hosts = [
#   "registry.npmjs.org",
#   "pypi.org",
#   "files.pythonhosted.org",
#   "github.com",
#   "objects.githubusercontent.com",
# ]


env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_URL = "${DB_URL:-postgres://deku_app:deku-local-dev@postgres:5432/ethara}", DATABASE_URL = "${DATABASE_URL:-postgres://deku_app:deku-local-dev@postgres:5432/ethara}" }

# A healthcheck is emitted only because a backend slot is declared, and it checks
# the SIDECAR, never the agent's application.
[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

# ---------------------------------------------------------------------------
# Verifier. Shared mode (D2): a separate verifier environment is torn up only
# after Harbor has already stopped the agent environment, so a separate grader
# never sees a live application.
#
# DB_ADMIN_URL is the privileged escape hatch and lives HERE ONLY (INV4). An
# agent holding it could satisfy substeps by writing rows directly -- including
# writing a `reserved` value the constraint would otherwise have refused, which
# is exactly the observation this task is built on.
# ---------------------------------------------------------------------------
[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0

env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgres://deku_admin:deku-local-dev@postgres:5432/ethara}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DEKU_SERVICE_BACKEND = "postgres" }

# ---------------------------------------------------------------------------
# Artifacts, collected after the agent phase and before the verifier runs, so the
# agent's source survives even when the verifier fails.
# ---------------------------------------------------------------------------
[[artifacts]]
source      = "/app"
destination = "app"
