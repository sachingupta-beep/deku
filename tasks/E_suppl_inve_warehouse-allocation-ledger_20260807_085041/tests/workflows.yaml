# Hidden grading checklist for ethara/warehouse-allocation-ledger.
#
# A workflow passes when passing_substeps / total_substeps >= 0.90 AND every
# substep marked `critical` passed. reward = passing_workflows / total_workflows.
#
# `critical` is the ONLY judgement about worth in this file, and this file is the
# only place it is written. No weight, no score, no points: pass thresholds and
# reward arithmetic belong to the vendored grader.
#
# The database is this task's anti-gaming surface. A browser cannot fire two
# requests at one row at the same instant, and cannot tell a derived free count
# from a cached one, so every arithmetic and contention observation below is a
# pytest substep reading postgres through the backend capability fixture. What a
# planner does and sees on the board is the browser's, and whether the board and
# the refusal read as a live control surface is the rubric's.

# ---------------------------------------------------------------- happy paths

- id: planner_reserves_pallets_from_shared_pool
  purpose: A planner holds stock against a live item and free stock falls by the held quantity
  substeps:
    - kind: browser
      do: Sign in at /login as planner@example.com using the credentials in /app/USER_README.md
      cov: C-UF-01, C-UF-02, C-RL-01, C-DM-49, C-UF-17
    - kind: browser
      do: Open /board and confirm five pallet rows, then open PLT-1001 and read 18 free
      cov: C-UF-03, C-UF-04, C-UF-05, C-UF-06, C-UF-18
    - kind: browser
      do: Reserve 4 pallets of PLT-1001 and watch the free chip settle on 14 with the held chip on 10
      cov: C-UF-19, C-UF-20, C-RL-04, C-UF-21
    - kind: pytest
      test: test_core_features.py::test_reservation_holds_stock_and_lowers_free
      critical: true

- id: planner_releases_a_held_reservation
  purpose: Releasing a hold returns the stock to the shared pool
  substeps:
    - kind: browser
      do: Open /reservations as planner@example.com and confirm the new hold is listed
      cov: C-UF-07, C-UF-22, C-RL-06
    - kind: browser
      do: Release that hold and watch free stock on PLT-1001 return to 18
      cov: C-UF-23, C-RL-05
    - kind: pytest
      test: test_core_features.py::test_release_returns_stock_to_free

- id: stock_admin_adjusts_on_hand_count
  purpose: The stock admin moves an on-hand count with a written reason
  substeps:
    - kind: browser
      do: Sign in as stock_admin@example.com and open PLT-1004 from the board
      cov: C-UF-26, C-RL-09, C-RL-12
    - kind: browser
      do: Adjust PLT-1004 by plus 5 with a reason and watch on hand reach 15 with free at 15
      cov: C-UF-27, C-UF-28
    - kind: pytest
      test: test_core_features.py::test_adjustment_raises_on_hand_and_free

- id: ledger_records_every_movement
  purpose: Each accepted movement leaves one line naming its actor and the free count it left
  substeps:
    - kind: browser
      do: Open /ledger and confirm the newest line is the adjustment carrying its reason
      cov: C-UF-29, C-RL-11
    - kind: browser
      do: Confirm every ledger line shows a time, a kind, a signed delta, a free-after count, an actor
      cov: C-UX-53
    - kind: pytest
      test: test_core_features.py::test_ledger_line_records_actor_and_free_after

- id: allocation_board_reconciles_with_stock
  purpose: Every board row agrees with the stock row behind it rather than with a cached counter
  substeps:
    - kind: browser
      do: Open /board as planner@example.com and confirm each row carries on hand, held, free chips
      cov: C-UX-40, C-UX-41, C-UX-42, C-UX-43
    - kind: browser
      do: Confirm the free numeral is the largest element on each board row
      cov: C-UX-23, C-UX-24
    - kind: pytest
      test: test_data_integrity.py::test_board_reconciles_with_stock_rows
      critical: true

- id: live_board_updates_for_every_watching_planner
  purpose: A movement made in one browser reaches another planner's open board untouched
  substeps:
    - kind: browser
      do: Open /board in one browser as planner@example.com and in a second as planner2@example.com
      cov: C-UF-34
    - kind: browser
      do: Reserve 2 pallets of PLT-1003 in the first browser
      cov: C-CF-53
    - kind: browser
      do: Without touching the second browser, watch its free count for PLT-1003 move from 8 to 6 inside five seconds
      cov: C-UF-35, C-CF-54, C-CF-55
    - kind: pytest
      test: test_data_integrity.py::test_reserved_column_matches_held_reservations

- id: auditor_reads_the_board_and_the_ledger
  purpose: The read-only role reaches both reads and the ledger keeps its history
  substeps:
    - kind: browser
      do: Sign in as auditor@example.com and open /board, then /ledger
      cov: C-RL-16, C-RL-17, C-RL-18
    - kind: browser
      do: Confirm no reserve control and no adjust control appears anywhere for this role
      cov: C-UF-15
    - kind: pytest
      test: test_data_integrity.py::test_ledger_survives_release_and_reread
      critical: true

# ------------------------------------------------------------ non-happy paths

- id: reservation_beyond_free_stock_refused
  purpose: A reservation against a fully committed item is refused with the quantity still free
  substeps:
    - kind: browser
      do: Sign in as planner@example.com, open PLT-1002 and confirm the row reads zero free
      cov: C-UF-30, C-UX-11
    - kind: browser
      do: Ask for 1 pallet and confirm the page states that 0 are free with the reserve control still in place
      cov: C-UF-31, C-UF-32, C-UF-33, C-UX-44, C-UX-45, C-UX-46, C-UX-47
    - kind: pytest
      test: test_edge_cases.py::test_reservation_beyond_free_refused_with_free_quantity
      critical: true

- id: concurrent_reservations_cannot_oversell
  purpose: Two planners asking for the last pallets at once leave exactly one success
  substeps:
    - kind: pytest
      test: test_edge_cases.py::test_concurrent_reservations_cannot_oversell
      critical: true

- id: duplicate_release_conflict
  purpose: Releasing one reservation twice is a conflict that gives stock back only once
  substeps:
    - kind: browser
      do: Release a hold from /reservations, then attempt the same release again from a stale view
      cov: C-UF-24, C-UF-25
    - kind: pytest
      test: test_edge_cases.py::test_duplicate_release_refused

- id: adjustment_below_held_stock_refused
  purpose: An adjustment that would strand held stock is refused from the other side of the constraint
  substeps:
    - kind: browser
      do: Sign in as stock_admin@example.com and attempt to write PLT-1001 down to zero on hand
      cov: C-UF-14
    - kind: browser
      do: Confirm the refusal names the quantity still free beside the adjust control
      cov: C-OV-16, C-CF-31
    - kind: pytest
      test: test_edge_cases.py::test_adjustment_below_held_stock_refused
      critical: true

- id: invalid_reservation_quantity_refused
  purpose: A reservation of nothing is a validation refusal rather than a stock refusal
  substeps:
    - kind: browser
      do: As planner@example.com attempt to reserve 0 pallets of PLT-1004 and read the field message
      cov: C-UF-36, C-UF-37
    - kind: pytest
      test: test_edge_cases.py::test_zero_quantity_reservation_refused

- id: empty_pallet_row_shows_zero_free
  purpose: An item nothing has moved reads three zeros with an empty ledger
  substeps:
    - kind: browser
      do: Open PLT-1005 from the board and confirm three zeros with a short line saying nothing has moved
      cov: C-UF-38, C-UF-39, C-UF-40
    - kind: browser
      do: Sign in as a planner holding nothing and confirm /reservations shows a short line rather than a blank panel
      cov: C-UF-41, C-UF-42
    - kind: pytest
      test: test_edge_cases.py::test_empty_pallet_row_reads_zero_free

- id: stock_admin_cannot_reserve_pallets_forbidden
  purpose: The stock admin is denied at the API on the reservation route
  substeps:
    - kind: browser
      do: Sign in as stock_admin@example.com, open /reservations directly and confirm a redirect to /board
      cov: C-UF-13, C-RL-13
    - kind: pytest
      test: test_authorization.py::test_stock_admin_cannot_reserve_pallets
      critical: true

- id: planner_cannot_adjust_on_hand_forbidden
  purpose: A planner is denied at the API on the adjustment route
  substeps:
    - kind: browser
      do: Sign in as planner@example.com and confirm no adjust control appears on any item page
      cov: C-RL-07, C-RL-23, C-RL-24
    - kind: pytest
      test: test_authorization.py::test_planner_cannot_adjust_on_hand
      critical: true

- id: auditor_denied_every_mutation
  purpose: The read-only role is refused on all three mutations at the API
  substeps:
    - kind: browser
      do: Sign in as auditor@example.com, open /reservations directly and confirm a redirect to /board
      cov: C-UF-16, C-RL-19, C-RL-20, C-RL-21
    - kind: pytest
      test: test_authorization.py::test_auditor_is_denied_every_mutation
      critical: true

- id: planner_cannot_release_another_planners_reservation_forbidden
  purpose: A planner aiming a release at somebody else's hold is denied at the API
  substeps:
    - kind: browser
      do: Sign in as planner@example.com and confirm /reservations lists no hold belonging to planner2@example.com
      cov: C-RL-29, C-RL-30
    - kind: pytest
      test: test_authorization.py::test_planner_cannot_release_another_planners_reservation
      critical: true

- id: unauthenticated_board_read_denied
  purpose: An anonymous caller is denied on every protected route
  substeps:
    - kind: browser
      do: Open /board without signing in and confirm a redirect to /login
      cov: C-UF-11, C-UF-12
    - kind: pytest
      test: test_authorization.py::test_unauthenticated_reservation_denied
      critical: true
