# Sidecar services for the `backend` slot (PLAN.md 3.3).
#
# NOT generated by environment/compose.py. The central catalog fragment hardcodes
# the corpus defaults (db `ethara`, role `deku_admin`, password `deku-local-dev`),
# but this task pins its own connection strings in task.toml:
#
#   DATABASE_URL  = postgresql://app:deku-app-pw-2026@postgres:5432/strength_log
#   DB_ADMIN_URL  = postgresql://verifier_admin:deku-verifier-pw-2026@postgres:5432/strength_log
#
# Generating from the catalog would start a Postgres the app cannot log into, and
# the failure would surface as "the agent never connected to its database" rather
# than a credential mismatch. The values below are derived FROM task.toml -- if
# you change one, change both.
#
# Privilege split (PLAN.md 3.4): the agent gets the unprivileged `app` role, the
# verifier gets `verifier_admin` as superuser. The agent must never hold the
# admin credential, or it can satisfy a workflow by writing rows directly instead
# of implementing the feature.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Bootstrap superuser == the credential DB_ADMIN_URL hands the verifier.
      POSTGRES_USER: verifier_admin
      POSTGRES_PASSWORD: deku-verifier-pw-2026
      POSTGRES_DB: strength_log
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier_admin -d strength_log"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

# No `main:` block on purpose.
#
# Harbor defines the agent container itself and merges this file over its own
# base, so a task only declares `main` when it needs to OVERRIDE something. Other
# tasks in this corpus carry a `main: ports: ["4173:4173"]` block, which was a
# workaround for `separate` verifier mode; under `shared` the verifier reaches the
# app on localhost inside that same container, so it buys nothing and binds a
# fixed HOST port -- capping concurrency at one trial machine-wide.
#
# Omitting `main` also keeps this file valid on its own (`docker compose config`
# passes), which a bare `main:` with no image does not.
