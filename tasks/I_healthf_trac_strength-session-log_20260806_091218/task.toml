# Corpus is pinned to 1.3; validate_task.py rejects anything else so a task
# cannot silently use fields the rest of the harness does not read.
schema_version = "1.3"

[task]
name = "ethara/strength-session-log"
description = "A lifter logs every set of a workout with exercise, weight and reps, and reads a per-exercise weekly trend. A re-submitted set is stored once and counted once."

[metadata]
category = "Greenfield"
# PLAN.md 1.6/4.1: the audience archetype, one of individual /
# solo_founder / enterprise. One lifter tracking their own sets.
sub_category = "individual"
domain = "health-fitness"
pattern = "tracker-log"
archetype = "strength-session-log"
variant = "a"
variant_axes = []
service_profile = "P1-db"
task_code = "I_healthf_trac_strength-session-log_20260806_091218"
naming_scheme = "task-code-v1"
grader_version = "UNPINNED-vendor-absent"
spec_sections_given = [
  "overview", "user_roles", "core_features", "user_flow", "ui_ux_notes",
  "technical_requirements", "data_model", "build_plan", "constraints",
  "deployment_contract", "definition_of_done",
]
canary_present = true
# Calibration fields are never written by the kit (plan §4.3). Present and empty.
# PLAN.md 4.6. Idempotent set writes, replay-safe trend aggregation and a
# concurrency case put this above the CRUD tasks but below the
# multi-service ones. Revise once calibration trials exist.
difficulty = "medium"
pass_rate = ""

[metadata.services]
backend = "postgres"

[verifier]
environment_mode = "shared"

[verifier.env]
DB_ADMIN_URL = "postgresql://verifier_admin:deku-verifier-pw-2026@postgres:5432/strength_log"

# Both graders are model-driven: run_workflows.py drives Chromium with an LLM,
# and run_rubric.py grades this task's 15 rubric criteria with one call each.
# Neither has a non-LLM fallback, so without a key every browser substep and
# every criterion scores 0 -- silently, and indistinguishably from an app that
# genuinely failed. Bare ${VAR} (no default) is deliberate: Harbor refuses to
# start the run when it is unset, rather than grading with an empty string.
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}"

# capabilities.py resolves the backend adapter from DEKU_SERVICE_<SLOT>. Without
# this the `db` fixture raises on selected("backend"), pytest collects nothing,
# and every pytest substep fails as a collection error rather than a test result.
DEKU_SERVICE_BACKEND = "postgres"

[environment]
# LOCAL-DEV SETTING -- revert to "none" before this task is admitted.
# Docker Desktop's LinuxKit kernel lacks CONFIG_NFT_FIB_INET, so Harbor
# cannot enforce ANY non-public policy and rejects the task outright
# ("network_mode=none is not supported by docker environment"). Same note
# as tasks/calculator and tasks/streak-habit-tracker.
network_mode = "public"

[environment.env]
DATABASE_URL = "postgresql://app:deku-app-pw-2026@postgres:5432/strength_log"
APP_PUBLIC_PORT = "4173"

# ---------------------------------------------------------------------------
# Gate the agent phase on Postgres actually being reachable. Without this the
# agent can start before the sidecar accepts connections, fail its first query,
# and spend the run working around a database that was merely slow to boot.
# ---------------------------------------------------------------------------
[environment.healthcheck]
command            = "pg_isready -h postgres -U verifier_admin -d strength_log > /dev/null"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

# ---------------------------------------------------------------------------
# Collected after the agent phase and before the verifier runs, so the built
# source survives even when grading fails. Two things depend on it: post-hoc
# inspection of a zero-reward trial, and harness/eval_fresh.py, which redeploys
# THIS artifact into a clean container. Without it there is nothing to redeploy
# and the clean-container grade is lost entirely.
# ---------------------------------------------------------------------------
[[artifacts]]
source      = "/app"
destination = "app"
