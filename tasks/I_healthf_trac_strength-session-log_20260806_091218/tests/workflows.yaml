# workflows.yaml -- the checklist for ethara/strength-session-log.
# S6 owns `critical` and nothing else about worth. No weight, no scoring, no thresholds:
# pass arithmetic belongs to the vendored grader.
#
# Category individual -> workflow band 6-10 (reference B.3). Count: 9.
# Channel split (INV7): a deterministic side effect at the HTTP surface is pytest;
# what the lifter does or sees in the browser is browser; judgement is the rubric (S8).

- id: lifter_logs_a_set
  purpose: A lifter signs in, opens a session and logs a working set that appears in the session list
  substeps:
    - kind: pytest
      test: test_core_features.py::test_health_is_served_unauthenticated
      cov: C-TR-05, C-DC-05, C-DC-01, C-DC-04, C-TR-06, C-DC-02, C-DC-03
    - kind: browser
      do: Sign in as lifter@ethara.ai with the seeded password and land on the session page
      cov: C-UF-06, C-RL-06, C-RL-07, C-RL-08, C-UF-05, C-UF-07, C-RL-01, C-RL-02, C-RL-03, C-RL-04
    - kind: browser
      do: Start a session and enter Back Squat at 100 kg for 5 reps in the set entry form
      cov: C-UF-09, C-UF-08, C-CF-03, C-CF-04, C-CF-05, C-CF-06, C-CF-07, C-CF-46
    - kind: browser
      do: Confirm the submitted set appears once in the session set list showing its weight and reps
      cov: C-UF-11, C-UF-12, C-UF-17, C-OV-01, C-OV-02
    - kind: pytest
      test: test_core_features.py::test_log_set_returns_201_and_stores_the_set
      critical: true
      cov: C-CF-02, C-CF-01, C-CF-31

- id: duplicate_set_uid_is_stored_once
  purpose: Re-submitting a set with a stored set_uid returns the original set and writes no second row
  substeps:
    - kind: pytest
      test: test_core_features.py::test_replayed_set_uid_returns_200_with_the_stored_set
      critical: true
      cov: C-CF-13, C-CF-14, C-CF-10, C-OV-04
    - kind: pytest
      test: test_data_integrity.py::test_replayed_set_uid_adds_no_second_row
      critical: true
      cov: C-CF-15, C-CF-11, C-CF-12
    - kind: browser
      do: Submit the same set twice from the set entry form and confirm the set list still shows it once
      cov: C-UF-13, C-CF-08, C-CF-09

- id: duplicate_set_uid_with_conflicting_body_keeps_the_first_write
  purpose: A replay carrying a different weight and reps still returns the originally stored values
  substeps:
    - kind: pytest
      test: test_core_features.py::test_replay_with_different_body_returns_the_original_values
      critical: true
      cov: C-CF-16, C-CF-17

- id: concurrent_duplicate_submissions_store_one_row
  purpose: Two simultaneous submissions of one set_uid resolve to exactly one stored set
  substeps:
    - kind: pytest
      test: test_edge_cases.py::test_concurrent_same_set_uid_stores_exactly_one_row
      critical: true
      cov: C-CF-18, C-CF-32

- id: trend_reconciles_with_the_logged_sets
  purpose: The per-exercise weekly trend reports the top weight, volume and set count of the stored sets
  substeps:
    - kind: browser
      do: Open the trend page, pick Back Squat and read the weekly rows oldest week first
      cov: C-UF-14, C-CF-19, C-CF-20, C-CF-21, C-OV-03
    - kind: pytest
      test: test_data_integrity.py::test_trend_reports_seeded_week_totals
      critical: true
      cov: C-CF-26, C-CF-27, C-CF-28, C-CF-23, C-CF-25, C-DM-10, C-DM-11, C-DM-12, C-DM-13
    - kind: pytest
      test: test_data_integrity.py::test_trend_orders_weeks_oldest_first
      cov: C-CF-24, C-CF-29

- id: replayed_set_does_not_move_the_trend
  purpose: Replaying a stored set leaves the weekly top weight, volume and set count unchanged
  substeps:
    - kind: pytest
      test: test_data_integrity.py::test_replay_leaves_trend_totals_unchanged
      critical: true
      cov: C-CF-30

- id: invalid_set_submissions_are_rejected
  purpose: A non-positive weight, a non-positive rep count and an unknown exercise are each rejected
  substeps:
    - kind: pytest
      test: test_edge_cases.py::test_non_positive_weight_is_rejected_422
      critical: true
      cov: C-CF-38, C-DM-07
    - kind: pytest
      test: test_edge_cases.py::test_non_positive_reps_is_rejected_422
      cov: C-CF-39, C-DM-08
    - kind: pytest
      test: test_edge_cases.py::test_unknown_exercise_slug_is_rejected_422
      cov: C-CF-40, C-CF-45, C-CF-47, C-CF-48, C-CF-49, C-DM-01, C-DM-02
    - kind: pytest
      test: test_edge_cases.py::test_rejected_submission_writes_no_row
      cov: C-CF-42
    - kind: browser
      do: Submit a set with a zero weight and confirm the form keeps the entered values with a reason shown
      cov: C-UF-18, C-CF-41

- id: logging_into_a_finished_session_is_rejected
  purpose: A finished session accepts no further sets and a second open session is refused
  substeps:
    - kind: browser
      do: Finish the open session and confirm the set entry form is withdrawn
      cov: C-UF-15, C-CF-34, C-CF-35, C-CF-37, C-DM-05
    - kind: pytest
      test: test_core_features.py::test_set_into_finished_session_is_rejected_409
      critical: true
      cov: C-CF-43, C-DM-06
    - kind: pytest
      test: test_core_features.py::test_second_open_session_is_rejected_409
      cov: C-CF-33, C-CF-36, C-DM-03, C-DM-04, C-DM-09

- id: unauthenticated_and_cross_owner_requests_are_denied
  purpose: A request with no bearer token is refused and one lifter cannot reach another lifter's session
  substeps:
    - kind: pytest
      test: test_authorization.py::test_trend_without_token_is_denied_401
      critical: true
      cov: C-RL-10, C-RL-09, C-RL-13, C-TR-03, C-TR-05, C-TR-06
    - kind: pytest
      test: test_authorization.py::test_set_into_another_lifters_session_is_denied_404
      critical: true
      cov: C-CF-44, C-RL-12, C-CF-22
    - kind: pytest
      test: test_authorization.py::test_trend_is_scoped_to_the_calling_lifter
      critical: true
      cov: C-CF-22, C-RL-11, C-RL-05, C-TR-01, C-TR-02
