schema_version = "1.4"

[task]
name = "ethara/revenue-report-dashboard"
version = "1.0.0"
description = "Regional revenue reporting console whose published aggregates reconcile exactly with the transaction rows behind them and scope every figure to the reader's own region"
authors = []
keywords = ["greenfield", "enterprise", "python", "postgres", "analytics", "reporting"]

[metadata]
category     = "Greenfield"
sub_category = "enterprise"

domain          = "analytics-reporting"
pattern         = "dashboard-analytics"
service_profile = "P1-db"
variant_axes    = []
capability_flags = ""

language     = "python"
archetype    = "revenue-report-dashboard"
variant      = "a"
difficulty   = ""
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 130
tokens_expected = 4800000
contributor_id  = "<contributor-id>"
created_at      = "2026-08-10"
canary_present  = true
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
calibration_date     = ""
openhands_version    = ""
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
# LOCAL-DEV SETTING -- revert to "allowlist" before admission. Docker Desktop's
# LinuxKit kernel lacks CONFIG_NFT_FIB_INET, so Harbor cannot enforce any
# non-public policy and rejects the task outright:
#   ValueError: network_mode='allowlist' is not supported by EnvironmentType.DOCKER
network_mode  = "public"
# allowed_hosts = ["registry.npmjs.org", "pypi.org", "files.pythonhosted.org", "github.com", "objects.githubusercontent.com"]
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/ethara}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/ethara}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/ethara}", DEKU_SERVICE_BACKEND = "postgres" }

[[artifacts]]
source      = "/app"
destination = "app"
