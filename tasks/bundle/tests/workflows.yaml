# Hidden grading checklist for ethara/revenue-report-dashboard (S6 output).
# The sole owner of `critical` (INV7 corollary): pytest emits observations,
# workflows assign criticality per §7.7.

# ---------------------------------------------------------------- happy paths

- id: app_is_reachable_and_serving
  purpose: The deployed app answers at its public URL with the API on the same origin
  substeps:
    - kind: browser
      do: Open the app at its public URL and verify the sign-in page renders over the same origin that serves the API prefix
      cov: C-DC-01, C-DC-02, C-DC-03, C-DC-04, C-DC-05, C-DC-07, C-DC-11, C-DC-12, C-DC-13, C-DC-14, C-DC-15, C-DC-16

- id: analyst_signs_in_and_reads_report_list
  purpose: The analyst signs in and sees both seeded reports, draft and published
  substeps:
    - kind: browser
      do: Open the app, land on `/login`, sign in as `analyst@example.com` with `deku-demo-pw-2026`, and verify the report list shows `January 2026 Revenue` and `February 2026 Revenue`
      cov: C-UF-01, C-UF-02, C-UF-03, C-UF-07, C-UF-09, C-UF-10, C-RL-01, C-RL-15
    - kind: pytest
      test: test_core_features.py::test_login_returns_access_token
    - kind: pytest
      test: test_core_features.py::test_reports_list_shape_for_analyst

- id: manager_signs_in_and_reads_own_region_summary
  purpose: The North manager opens the published January report and reads only North figures
  substeps:
    - kind: browser
      do: Sign in as `manager@example.com` with `deku-demo-pw-2026`, open `January 2026 Revenue`, and verify the grand total reads `$1,950.00` with a single region row for `North`
      cov: C-UF-05, C-UX-23, C-UX-24, C-UX-33, C-OV-06, C-RL-06, C-RL-07
    - kind: pytest
      test: test_authorization.py::test_manager_summary_scoped_to_own_region
      critical: true
    - kind: pytest
      test: test_core_features.py::test_me_returns_role_and_region

- id: analyst_summary_reconciles_with_underlying_rows
  purpose: The analyst summary totals agree with each other and with the rows the report lists
  substeps:
    - kind: browser
      do: As `analyst@example.com`, open `January 2026 Revenue` and verify three region rows and two product line rows, then open `/reports/:id/transactions` and verify the listed rows
      cov: C-UF-06, C-OV-02, C-OV-03, C-OV-04, C-OV-07
    - kind: pytest
      test: test_core_features.py::test_summary_shape_and_analyst_totals
      critical: true
    - kind: pytest
      test: test_core_features.py::test_summary_breakdowns_sum_to_total
      critical: true
    - kind: pytest
      test: test_core_features.py::test_transactions_endpoint_rows_sum_to_total
      critical: true

- id: new_report_summary_computed_on_read
  purpose: A report created after seed time still reconciles, so no aggregate was precomputed
  substeps:
    - kind: pytest
      test: test_data_integrity.py::test_new_report_summary_reconciles_on_read
      critical: true

- id: analyst_creates_and_publishes_report
  purpose: The analyst drafts a report and publishes it once
  substeps:
    - kind: browser
      do: As `analyst@example.com`, open `/reports/new`, create a report over a January 2026 period, then publish it and verify the status reads published
      cov: C-UF-04, C-UX-36, C-RL-04, C-RL-05
    - kind: pytest
      test: test_core_features.py::test_analyst_creates_draft_report
    - kind: pytest
      test: test_core_features.py::test_publish_flips_draft_to_published
      critical: true

- id: seeded_accounts_persisted
  purpose: The three seeded accounts exist with their pinned roles and regions
  substeps:
    - kind: pytest
      test: test_data_integrity.py::test_seeded_accounts_persisted
      critical: true

- id: seeded_reference_data_persisted
  purpose: The seeded regions and product lines exist with their pinned names
  substeps:
    - kind: pytest
      test: test_data_integrity.py::test_seeded_regions_persisted
    - kind: pytest
      test: test_data_integrity.py::test_seeded_product_lines_persisted
    - kind: pytest
      test: test_core_features.py::test_product_lines_returns_both_lines

- id: seeded_reports_persisted
  purpose: The January report is published and the February report is still a draft
  substeps:
    - kind: pytest
      test: test_data_integrity.py::test_seeded_january_report_published
      critical: true
    - kind: pytest
      test: test_data_integrity.py::test_seeded_february_report_draft

- id: published_report_survives_a_reread
  purpose: A published report is still published, with the same publication time, on a fresh read
  substeps:
    - kind: pytest
      test: test_data_integrity.py::test_published_report_survives_reread
      critical: true

- id: excluded_rows_absent_from_report_totals
  purpose: Refunded, void and out-of-period rows appear in no figure and no row list
  substeps:
    - kind: pytest
      test: test_data_integrity.py::test_excluded_rows_absent_from_transactions
      critical: true

# ------------------------------------------------------------ non-happy paths

- id: manager_cannot_create_a_report
  purpose: A manager is denied both write endpoints at the API, not merely in the UI
  substeps:
    - kind: browser
      do: Sign in as `manager@example.com` and open `/reports/new`, then verify a permission message is shown rather than a create form
      cov: C-UF-15, C-UF-20, C-RL-10
    - kind: pytest
      test: test_authorization.py::test_manager_cannot_create_report
      critical: true
    - kind: pytest
      test: test_authorization.py::test_manager_cannot_publish_report
      critical: true

- id: cross_region_summary_forbidden
  purpose: A manager naming another region is refused and sees no figure for it
  substeps:
    - kind: pytest
      test: test_authorization.py::test_manager_cross_region_query_forbidden
      critical: true
    - kind: pytest
      test: test_authorization.py::test_manager_transactions_scoped_to_own_region
      critical: true

- id: manager_cannot_read_a_draft_report
  purpose: An unpublished report does not exist for a manager
  substeps:
    - kind: browser
      do: Sign in as `manager2@example.com`, request the `February 2026 Revenue` report, and verify a not-found card is shown
      cov: C-UF-16, C-UF-19, C-RL-08
    - kind: pytest
      test: test_authorization.py::test_manager_cannot_read_draft_report
      critical: true

- id: unauthenticated_request_rejected
  purpose: A request with no bearer token is refused at every endpoint except health
  substeps:
    - kind: pytest
      test: test_authorization.py::test_unauthenticated_request_rejected
      critical: true

- id: manager_region_list_scoped
  purpose: The region list itself is scoped, so the ledger shape does not leak
  substeps:
    - kind: pytest
      test: test_authorization.py::test_manager_regions_list_scoped
      critical: true
    - kind: pytest
      test: test_core_features.py::test_regions_list_scoped_for_analyst

- id: invalid_report_period_rejected
  purpose: A backwards period and a malformed token are both refused with a named reason
  substeps:
    - kind: pytest
      test: test_edge_cases.py::test_backwards_period_rejected
    - kind: pytest
      test: test_edge_cases.py::test_invalid_token_rejected

- id: duplicate_publish_conflict
  purpose: A second publish of the same report conflicts and leaves the publication time alone
  substeps:
    - kind: pytest
      test: test_edge_cases.py::test_second_publish_conflicts

- id: empty_period_reports_zero
  purpose: A period with no settled rows reports zero and empty breakdowns rather than an error
  substeps:
    - kind: browser
      do: As `analyst@example.com`, create and publish a report over a period holding no settled transactions, then verify the page shows a zero total with an empty state rather than an error
      cov: C-UF-17, C-UF-18, C-UF-21
    - kind: pytest
      test: test_edge_cases.py::test_empty_period_returns_zero_totals
    - kind: pytest
      test: test_edge_cases.py::test_unknown_report_returns_not_found
