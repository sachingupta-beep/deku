# Hidden grading checklist for deku/calculator.
#
# The agent never sees this file. Harbor uploads tests/ inside verifier.verify(),
# which runs after the agent phase has already ended.
#
# reward = passing_workflows / total_workflows
# workflow passes iff  passing_substeps / graded_substeps >= 0.90
#                     AND every substep marked `critical` passed.
#
# Browser substeps drive the UI; pytest substeps assert the side effect that UI
# action should have produced. The browser pass runs FIRST so pytest only ever
# sees state a user actually created (PLAN.md 4.5).

# ---------------------------------------------------------------- happy paths

- id: page_loads_and_renders_calculator
  purpose: The single-page app loads and shows a display, a keypad, and a history panel
  substeps:
    - kind: browser
      do: Open the root URL and verify the page renders a calculator with a visible display area and clickable controls for digits and the four operators plus minus times divide
    - kind: browser
      do: Verify the page shows a history area (a list, panel, or section labelled history or recent) and that it is visibly empty or shows no calculation rows before anything has been entered

- id: keypad_calculation_shows_result
  purpose: Entering an expression and pressing equals shows the correct answer on the display
  substeps:
    - kind: browser
      do: Using the on-screen controls enter the expression 12+5*3 and activate the equals control, then confirm the display shows the result 27
    - kind: browser
      do: Clear the display, enter 7/2, activate equals, and confirm the display shows 3.5

- id: calculation_appears_in_history
  purpose: A calculation made in the UI is recorded server-side, not just in the page
  substeps:
    - kind: browser
      do: After evaluating an expression, confirm a history row appears showing that expression and its result
    - kind: pytest
      test: test_calculator.py::test_history_records_calculation
      critical: true

- id: api_health_endpoint_reachable
  purpose: /api/health answers 200 so the healthcheck can go green
  substeps:
    - kind: pytest
      test: test_calculator.py::test_health_endpoint_returns_200
      critical: true

- id: api_respects_operator_precedence
  purpose: Multiplication and division bind tighter than addition and subtraction
  substeps:
    - kind: pytest
      test: test_calculator.py::test_calculate_respects_operator_precedence
      critical: true

- id: api_handles_parentheses_and_negatives
  purpose: Parentheses override precedence and unary minus parses in both positions
  substeps:
    - kind: pytest
      test: test_calculator.py::test_calculate_handles_parentheses_and_negatives
      critical: true

- id: history_newest_first_and_capped
  purpose: History is ordered newest first and holds at most 20 entries
  substeps:
    - kind: pytest
      test: test_calculator.py::test_history_is_newest_first_and_capped
      critical: true

# ------------------------------------------------------------ non-happy paths

- id: history_cleared_leaves_empty_log
  purpose: Clearing the history empties it server-side, not just visually
  substeps:
    - kind: browser
      do: Activate the clear-history control and confirm the history panel no longer lists any calculation rows
    - kind: pytest
      test: test_calculator.py::test_history_clear_empties_the_log
      critical: true

- id: division_by_zero_rejected
  purpose: Dividing by zero is a 400 with a JSON error, not a 5xx, an Infinity, or a silent 200
  substeps:
    - kind: browser
      do: Enter the expression 1/0 and activate equals, then confirm a visible error message appears and the display does not show a stale numeric result from a previous calculation
    - kind: pytest
      test: test_calculator.py::test_division_by_zero_returns_400
      critical: true

- id: invalid_expression_rejected
  purpose: Malformed and non-arithmetic input is rejected and never reaches the history
  substeps:
    - kind: pytest
      test: test_calculator.py::test_invalid_expression_returns_400
      critical: true
    - kind: pytest
      test: test_calculator.py::test_rejected_expression_is_not_recorded
      critical: true
