# Sidecar services for the `backend`, `payments`, and `storage` slots (PLAN.md 3.3).
#
# Harbor merges this over its own build compose. The agent container is the
# `main` service; services here share its network namespace under egress
# control, so the app reaches Postgres at postgres:5432, MinIO at minio:9000,
# and deku-pay at deku-pay:8080.
#
# Zero-credential rule (PLAN.md 3.3): credentials are fixed local fixture
# values created by these containers at boot. Nothing is fetched from a vendor,
# nothing expires, and a fresh clone plus Docker is sufficient to run offline.
#
# Privilege split (PLAN.md 3.4):
#   - Agent gets UNPRIVILEGED postgres role deku_app, and the publishable/secret
#     payment keys, and the storage credentials.
#   - Verifier additionally gets deku_admin (superuser) via DB_ADMIN_URL.
#   - An agent holding the superuser credential could satisfy workflows by writing
#     rows directly; withholding it keeps the measurement honest.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deku_admin
      POSTGRES_PASSWORD: deku-local-dev
      POSTGRES_DB: ethara
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deku_admin -d ethara"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    # MinIO RELEASE.2024-06-04 -- arm64 + amd64 multi-arch, no `latest`.
    image: minio/minio:RELEASE.2024-06-04T19-20-08Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    # mc is bundled inside the minio server image at /usr/bin/mc.
    # MC_HOST_<alias> is the env-var alias syntax; no ~/.mc config file needed.
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=http://minioadmin:minioadmin@localhost:9000 mc ls local/ > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Creates the 'ethara' bucket (private policy) exactly once, then exits.
  # Uses the same image as the minio server so no extra image pull is needed.
  minio-init:
    image: minio/minio:RELEASE.2024-06-04T19-20-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        MC_HOST_local=http://minioadmin:minioadmin@minio:9000
        export MC_HOST_local &&
        mc mb --ignore-existing local/ethara &&
        mc anonymous set none local/ethara &&
        echo 'bucket ethara is ready and private'
      "
    restart: "no"

  # deku-pay: in-house adversarial payment provider (PLAN.md 3.3.1).
  # Built from ./deku-pay/ -- no external image registry required.
  deku-pay:
    build:
      context: ./deku-pay
    restart: unless-stopped
    environment:
      PAYMENTS_SECRET_KEY: sk_local_deku
      PAYMENTS_PUBLISHABLE_KEY: pk_local_deku
      PAYMENTS_WEBHOOK_SECRET: wh_local_deku
      DEKU_SETTLE_DELAY: "2"
    healthcheck:
      # python stdlib urlopen -- no curl/wget dependency in the slim image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Harbor's agent container. Ports only. Harbor merges this file LAST, so anything
  # added here overrides its own definition of `main`. Never add `image:`,
  # `command:` or `profiles:` -- an image/command replaces the built agent and its
  # entrypoint, and a profile makes compose skip the service entirely, so the agent
  # would never start. For standalone sidecar checks, name the sidecar services
  # explicitly (`up -d postgres minio deku-pay`) rather than stubbing `main`.
  main:
    ports:
      - "4173:4173"
