schema_version = "1.3"

[task]
name = "ethara/creator-subscription-billing"
version = "1.0.0"
description = "Creator publishing platform with paid monthly subscriptions, image posts and subscriber-only access"
authors = []
keywords = ["greenfield", "solo_founder", "typescript", "postgres", "deku-pay", "minio", "subscriptions"]

# ---------------------------------------------------------------------------
# Deku metadata (PLAN.md 4.1). Harbor treats [metadata] as arbitrary.
# ---------------------------------------------------------------------------
[metadata]
category     = "Greenfield"
sub_category = "solo_founder"
language     = "typescript"
archetype    = "creator-subscriptions"
variant      = "a"
difficulty   = "hard"            # written by calibration, never by the author

# Difficulty lever (PLAN.md 4.2): "buildplan" is withheld in variant a so the
# agent must sequence the build itself. The payments-plus-storage integration
# is the discriminator; without a build plan the agent has to design async
# webhook handling and access-controlled object URLs on its own.
spec_sections_given = [
  "overview",
  "roles",
  "features",
  "flow",
  "uiux",
  "techrequirements",
  "datamodel",
  "constraints",
  "contract",
]

turns_expected  = 170
tokens_expected = 7000000
contributor_id  = "<contributor-id>"
created_at      = "2026-08-03"
canary_present  = true

# Calibration record - filled by the Calibration Engineer, not the author.
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
calibration_date     = ""
openhands_version    = ""
harbor_version       = "0.20.0"

# Service matrix selection (PLAN.md 3.3). One provider per slot the task needs.
# Every slot listed here must have at least one `critical` pytest substep.
# Payments and storage are the anti-gaming surface of this task -- a browser
# grader cannot tell a real charge from a setTimeout, and cannot tell a real
# S3 upload from a base64 blob rendered from state. The verifier interrogates
# deku-pay and MinIO directly (PLAN.md 3.3.1, 4.7).
[metadata.services]
backend  = "postgres"
payments = "deku-pay"
storage  = "minio"

# ---------------------------------------------------------------------------
# Agent phase
# ---------------------------------------------------------------------------
[agent]
timeout_sec = 18000.0            # 5h - VCB budget (PLAN.md 3.5)

# ---------------------------------------------------------------------------
# Agent environment
# ---------------------------------------------------------------------------
[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0

# PLAN.md 3.6 targets no-network with a pre-seeded package cache. Until the
# Phase 2 cache lands this uses the documented allowlist fallback. Egress is
# build-time only: deku-pay and MinIO are sidecars on the internal network.
network_mode  = "allowlist"
allowed_hosts = [
  "registry.npmjs.org",
  "pypi.org",
  "files.pythonhosted.org",
  "github.com",
  "objects.githubusercontent.com",
]

# Canonical vars per slot (PLAN.md 3.4). Payments server keys and storage keys
# are legitimately shared between the app (which charges and uploads) and the
# verifier (which interrogates the same services independently). The privileged
# escape hatch DB_ADMIN_URL is verifier-only.
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DB_URL = "${DB_URL:-postgres://deku_app:deku-local-dev@postgres:5432/ethara}", DATABASE_URL = "${DATABASE_URL:-postgres://deku_app:deku-local-dev@postgres:5432/ethara}", PAYMENTS_API_URL = "${PAYMENTS_API_URL:-http://deku-pay:8080}", PAYMENTS_PUBLISHABLE_KEY = "${PAYMENTS_PUBLISHABLE_KEY:-pk_local_deku}", PAYMENTS_SECRET_KEY = "${PAYMENTS_SECRET_KEY:-sk_local_deku}", PAYMENTS_WEBHOOK_SECRET = "${PAYMENTS_WEBHOOK_SECRET:-wh_local_deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-ethara}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-minioadmin}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minioadmin}" }

# Gates verifier start on the app actually being up (PLAN.md 2.1 step 2).
[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

# ---------------------------------------------------------------------------
# Verifier - separate environment keeps workflows.yaml and grader code out of
# the agent's reach (PLAN.md 2.1, 4.7). Reachability to the agent's app plus
# the deku-pay and MinIO sidecars is the Phase 0 spike in PLAN.md 1.8.
# ---------------------------------------------------------------------------
[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0

# DB_ADMIN_URL is the privileged escape hatch and lives here ONLY (PLAN.md 3.4).
# An agent holding it can satisfy workflows by writing rows directly. Payments
# and storage credentials are legitimately shared with the agent phase because
# the verifier must interrogate the same services independently.
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgres://deku_admin:deku-local-dev@postgres:5432/ethara}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", PAYMENTS_API_URL = "${PAYMENTS_API_URL:-http://deku-pay:8080}", PAYMENTS_SECRET_KEY = "${PAYMENTS_SECRET_KEY:-sk_local_deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-ethara}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-minioadmin}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minioadmin}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_PAYMENTS = "deku-pay", DEKU_SERVICE_STORAGE = "minio" }

# ---------------------------------------------------------------------------
# Artifacts - collected after the agent phase and before the verifier runs,
# so the agent's built source is preserved even when the verifier fails.
# Lets a human inspect exactly what the agent wrote.
# ---------------------------------------------------------------------------
[[artifacts]]
source      = "/app"
destination = "app"

