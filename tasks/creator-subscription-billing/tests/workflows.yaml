# Hidden grading checklist (PLAN.md 4.4).
#
# Baked into the verifier image and NEVER uploaded to the agent container --
# [verifier].environment_mode = "separate" in task.toml is what guarantees that.
#
# A workflow passes iff  passing_substeps / total_substeps >= 0.90
#                        AND every substep marked `critical` passed.
# reward = passing_workflows / total_workflows.
#
# Payments and storage are this task's anti-gaming surface (PLAN.md 4.7). A
# browser grader cannot tell a real charge from a `setTimeout` and cannot tell
# a real S3 upload from a base64 blob rendered from state. Every payment and
# storage assertion below is a pytest substep, marked critical, and goes
# through the deku-pay / MinIO capability fixtures rather than the UI.

# ---------------------------------------------------------------- happy paths

- id: reader_subscribes_and_reads_paid_post
  purpose: A reader subscribes with a valid card and gains access to paid posts
  substeps:
    - kind: browser
      do: Sign in as reader@ethara.ai using the credentials in /app/USER_README.md
    - kind: browser
      do: Open the profile at /c/nova and click a subscriber-only post
    - kind: browser
      do: Click Subscribe, select the tok_visa_ok test card, and confirm
    - kind: browser
      do: Wait for the pending state to resolve and verify the paid post body now renders
    - kind: pytest
      test: test_payments.py::test_subscribe_creates_real_charge
      critical: true
    - kind: pytest
      test: test_payments.py::test_successful_charge_activates_subscription
      critical: true

- id: creator_publishes_post_with_image
  purpose: A creator publishes a paid post and its image lands in the real bucket
  substeps:
    - kind: browser
      do: Sign in as nova@ethara.ai
    - kind: browser
      do: Create a new post, upload an image, mark it subscriber-only, and publish
    - kind: browser
      do: Verify the post appears on the creator's own dashboard
    - kind: pytest
      test: test_storage.py::test_uploaded_image_lands_in_bucket
      critical: true

- id: subscribed_reader_reads_paid_image
  purpose: An entitled reader can actually fetch the bytes of a paid image
  substeps:
    - kind: pytest
      test: test_storage.py::test_entitled_reader_can_fetch_paid_image
      critical: true

- id: free_post_open_to_everyone
  purpose: Free posts are readable without a subscription or an account
  substeps:
    - kind: browser
      do: Open /c/nova without signing in and click a post marked free
    - kind: browser
      do: Verify the post body renders in full without any subscribe CTA
    - kind: pytest
      test: test_data_integrity.py::test_free_post_body_visible_to_anonymous
    - kind: pytest
      test: test_data_integrity.py::test_seeded_creators_present
      critical: true

- id: creator_dashboard_matches_database
  purpose: Dashboard numbers reflect true state, not a cached or invented count
  substeps:
    - kind: browser
      do: Sign in as nova@ethara.ai and open the dashboard
    - kind: browser
      do: Verify tiles for active subscribers and monthly revenue are present
    - kind: pytest
      test: test_data_integrity.py::test_dashboard_subscriber_count_matches_database
      critical: true
    - kind: pytest
      test: test_data_integrity.py::test_dashboard_revenue_matches_succeeded_charges
      critical: true

# ------------------------------------------------------------ non-happy paths

- id: declined_card_grants_no_access
  purpose: A declined charge leaves the subscription canceled and access blocked
  substeps:
    - kind: browser
      do: Sign in as reader2@ethara.ai and attempt to subscribe to Nova with tok_visa_decline
    - kind: browser
      do: Verify the app surfaces the decline and does not show a "subscribed" state
    - kind: pytest
      test: test_payments.py::test_declined_card_does_not_activate_subscription
      critical: true
    - kind: pytest
      test: test_access_control.py::test_declined_reader_cannot_read_paid_post
      critical: true

- id: non_subscriber_cannot_read_paid_post
  purpose: A non-subscriber's API call for a paid post is denied at the API
  substeps:
    - kind: browser
      do: Sign in as reader2@ethara.ai and open a Nova subscriber-only post
    - kind: browser
      do: Verify the locked view with a subscribe CTA is shown, not the post body
    - kind: pytest
      test: test_access_control.py::test_non_subscriber_paid_post_api_denied
      critical: true
    - kind: pytest
      test: test_access_control.py::test_non_subscriber_paid_post_body_omitted_from_list
      critical: true

- id: non_subscriber_cannot_fetch_paid_image_directly_forbidden
  purpose: A paid-post image is not fetchable by direct object URL to a non-subscriber
  substeps:
    - kind: pytest
      test: test_storage.py::test_non_subscriber_cannot_fetch_paid_image
      critical: true
    - kind: pytest
      test: test_storage.py::test_paid_bucket_object_not_publicly_readable
      critical: true

- id: unauthenticated_access_denied
  purpose: Protected endpoints reject anonymous callers
  substeps:
    - kind: browser
      do: Open /dashboard without signing in and verify a redirect to the login page
    - kind: pytest
      test: test_access_control.py::test_unauthenticated_requests_denied
      critical: true

- id: duplicate_webhook_does_not_double_grant
  purpose: An at-least-once webhook redelivery does not double-charge or double-count
  substeps:
    - kind: pytest
      test: test_payments.py::test_duplicate_webhook_is_idempotent
      critical: true

- id: invalid_webhook_signature_rejected
  purpose: A webhook with a bad signature must be rejected, not trusted
  substeps:
    - kind: pytest
      test: test_payments.py::test_invalid_webhook_signature_rejected
      critical: true

- id: creator_cannot_subscribe_to_own_content_rejected
  purpose: A creator is never charged for their own content
  substeps:
    - kind: pytest
      test: test_access_control.py::test_creator_cannot_subscribe_to_self

- id: concurrent_subscribe_single_winner
  purpose: Two simultaneous subscribe attempts for one reader-creator pair yield one row
  substeps:
    - kind: pytest
      test: test_payments.py::test_concurrent_subscribe_single_active_row
      critical: true

- id: empty_dashboard_for_creator_with_no_subscribers
  purpose: A creator with no subscribers sees a coherent empty state, not a broken tile
  substeps:
    - kind: browser
      do: Sign in as orion@ethara.ai and open the dashboard
    - kind: browser
      do: Verify the subscribers tile reads zero and the revenue tile reads $0.00
    - kind: pytest
      test: test_data_integrity.py::test_orion_dashboard_empty_state
