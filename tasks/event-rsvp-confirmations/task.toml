schema_version = "1.3"

[task]
name = "ethara/event-rsvp-confirmations"
version = "1.0.0"
description = "Small event-hosting app with organiser capacity control, guest RSVPs and SMTP confirmation emails"
authors = []
keywords = ["greenfield", "solo_founder", "typescript", "postgres", "mailpit", "smtp"]

# ---------------------------------------------------------------------------
# Deku metadata (PLAN.md 4.1). Harbor treats [metadata] as arbitrary.
# ---------------------------------------------------------------------------
[metadata]
category     = "Greenfield"
sub_category = "solo_founder"
language     = "typescript"
archetype    = "event-rsvp"
variant      = "a"
difficulty   = "medium"          # written by calibration, never by the author

# Difficulty lever (PLAN.md 4.2): "buildplan" is withheld in variant a so the
# agent must sequence the build itself.
spec_sections_given = [
  "overview",
  "roles",
  "features",
  "flow",
  "uiux",
  "techrequirements",
  "datamodel",
  "constraints",
  "contract",
]

turns_expected  = 120
tokens_expected = 4500000
contributor_id  = "<contributor-id>"
created_at      = "2026-08-03"
canary_present  = true

# Calibration record - filled by the Calibration Engineer, not the author.
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
calibration_date     = ""
openhands_version    = ""
harbor_version       = "0.20.0"

# Service matrix selection (PLAN.md 3.3). One provider per slot the task needs.
# Every slot listed here must have at least one `critical` pytest substep.
# Email is the whole point of this task: Mailpit is a real SMTP server, not a
# stub, and the verifier queries its inbox API directly.
[metadata.services]
backend = "postgres"
email   = "mailpit"

# ---------------------------------------------------------------------------
# Agent phase
# ---------------------------------------------------------------------------
[agent]
timeout_sec = 18000.0            # 5h - VCB budget (PLAN.md 3.5)

# ---------------------------------------------------------------------------
# Agent environment
# ---------------------------------------------------------------------------
[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0

# PLAN.md 3.6 targets no-network with a pre-seeded package cache. Until the
# Phase 2 cache lands this uses the documented allowlist fallback. Egress is
# build-time only: both providers are on the internal network.
network_mode  = "allowlist"
allowed_hosts = [
  "registry.npmjs.org",
  "pypi.org",
  "files.pythonhosted.org",
  "github.com",
  "objects.githubusercontent.com",
]

# Canonical env for the two selected slots (PLAN.md 3.4). SMTP credentials are
# the client end the agent uses to *send*; EMAIL_INBOX_API_URL is the inspection
# escape hatch and lives in [verifier].env only.
env = { APP_PUBLIC_PORT = "4173", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/ethara}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/ethara}", SMTP_HOST = "${SMTP_HOST:-mailpit}", SMTP_PORT = "${SMTP_PORT:-1025}", SMTP_USER = "${SMTP_USER:-}", SMTP_PASS = "${SMTP_PASS:-}" }

# Gates verifier start on the app actually being up (PLAN.md 2.1 step 2).
[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

# ---------------------------------------------------------------------------
# Verifier - separate environment keeps workflows.yaml and grader code out of
# the agent's reach (PLAN.md 2.1, 4.7).
# ---------------------------------------------------------------------------
[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0

# DB_ADMIN_URL and EMAIL_INBOX_API_URL are the privileged escape hatches and
# live here ONLY (PLAN.md 3.4). An agent holding either could satisfy workflows
# without implementing the feature - direct DB writes, or reading the inbox to
# fake a send.
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/ethara}", EMAIL_INBOX_API_URL = "${EMAIL_INBOX_API_URL:-http://mailpit:8025}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_EMAIL = "mailpit" }

# ---------------------------------------------------------------------------
# Artifacts - collected after the agent phase and before the verifier runs,
# so the agent's built source is preserved even when the verifier fails.
# Lets a human inspect exactly what the agent wrote.
# ---------------------------------------------------------------------------
[[artifacts]]
source      = "/app"
destination = "app"

