# Sidecar services for the `backend` slot (PLAN.md 3.3).
#
# Harbor merges this over its own build compose. The agent container is the
# `main` service, and services here share its network namespace under egress
# control -- so the app reaches PocketBase at `http://pocketbase:8090` and the
# separate verifier reaches the app at `http://main:4173`.
#
# Zero-credential rule (PLAN.md 3.3): the superuser is created by this container
# at start. Nothing is fetched from a vendor, nothing expires, and a fresh clone
# plus Docker is sufficient to run the task offline.

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.22.21
    restart: unless-stopped
    # The image's own POCKETBASE_ADMIN_* env vars do not create the account, so
    # the superuser is created explicitly here. `migrate up` must run first --
    # without it `admin create` fails with "Migration are not initialized yet"
    # and the verifier has no privileged credential to inspect state with.
    #
    # The entrypoint is overridden rather than using `command:` because the image
    # entrypoint already supplies `serve`; appending to it makes PocketBase read
    # "serve" as a hostname and bind https://serve with auto-TLS.
    volumes:
      - ./pocketbase-init.sh:/init.sh:ro
    entrypoint:
      - /bin/sh
      - /init.sh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Reachability fix (PLAN.md 1.8, answered empirically).
  #
  # Harbor gives the SEPARATE verifier its own compose project -- the session id
  # is "{trial}__verifier__{key}" and extra_docker_compose is stripped -- so it
  # lands on a different Docker network and cannot resolve `main`. Publishing the
  # app port lets the verifier reach it at host.docker.internal instead.
  #
  # Isolation is preserved where it matters: separate mode still means tests/ and
  # workflows.yaml are never uploaded into the agent container. Only the network
  # hop changes. Note the fixed host port caps local concurrency at one trial.
  main:
    ports:
      - "4173:4173"
