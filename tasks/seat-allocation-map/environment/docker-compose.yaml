# Sidecar services for the `backend` slot (PLAN.md 3.3).
#
# Harbor merges this over its own build compose. The agent container is the
# `main` service and services here share its network namespace under egress
# control -- so the app reaches Postgres at `postgres:5432` and the separate
# verifier reaches the app at `main:4173`.
#
# Zero-credential rule (PLAN.md 3.3): credentials are fixed local fixture values
# created by this container at boot. Nothing is fetched from a vendor, nothing
# expires, and a fresh clone plus Docker is sufficient to run the task offline.
#
# The agent gets an UNPRIVILEGED role and the verifier gets the superuser
# (PLAN.md 3.4). An agent holding the admin credential could satisfy workflows by
# writing rows directly instead of implementing the feature.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deku_admin
      POSTGRES_PASSWORD: deku-local-dev
      POSTGRES_DB: ethara
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deku_admin -d ethara"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Reachability fix (PLAN.md 1.8, answered empirically).
  #
  # Harbor gives the SEPARATE verifier its own compose project -- the session id
  # is "{trial}__verifier__{key}" and extra_docker_compose is stripped -- so it
  # lands on a different Docker network and cannot resolve `main`. Publishing the
  # app port lets the verifier reach it at host.docker.internal instead.
  #
  # Isolation is preserved where it matters: separate mode still means tests/ and
  # workflows.yaml are never uploaded into the agent container. Only the network
  # hop changes. Note the fixed host port caps local concurrency at one trial.
  main:
    ports:
      - "4173:4173"
