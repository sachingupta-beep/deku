schema_version = "1.3"

[task]
name = "deku/smoke-tip-calculator"
version = "1.0.0"
description = "Deliberately trivial tip calculator that smoke-tests the whole Deku pipeline end to end. Not a real corpus task -- its only purpose is to fail fast when the harness is broken."
authors = []
keywords = ["smoke", "ci", "trivial", "http"]

# ---------------------------------------------------------------------------
# Deku metadata (PLAN.md 4.1).
# ---------------------------------------------------------------------------
[metadata]
category     = "Greenfield"
sub_category = "individual"
language     = "any"
archetype    = "smoke-tip-calculator"
variant      = "a"
difficulty   = "trivial"

# All sections given -- this is a smoke test, not a difficulty probe.
spec_sections_given = [
  "overview",
  "features",
  "flow",
  "uiux",
  "techrequirements",
  "constraints",
  "contract",
]

turns_expected  = 20
tokens_expected = 200000
contributor_id  = "smoke"
created_at      = "2026-08-04"
canary_present  = true

reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
calibration_date     = ""
openhands_version    = ""
harbor_version       = "0.20.0"

# EMPTY on purpose. This task exists to prove the pipeline works with zero
# sidecars in the loop; adding one here defeats its whole point.
[metadata.services]

# ---------------------------------------------------------------------------
# Agent phase -- deliberately short. A tip calculator that takes an hour is a
# defective harness, not a hard task; the smoke test must surface that.
# ---------------------------------------------------------------------------
[agent]
timeout_sec = 900.0            # 15 min

# ---------------------------------------------------------------------------
# Agent environment
# ---------------------------------------------------------------------------
[environment]
os                = "linux"
cpus              = 2
memory_mb         = 2048
storage_mb        = 4096
build_timeout_sec = 900.0

# LOCAL-DEV SETTING -- revert to "allowlist" before admission. Docker Desktop's
# LinuxKit kernel lacks CONFIG_NFT_FIB_INET, so Harbor cannot enforce any
# non-public policy and rejects the task before the agent starts:
#   ValueError: network_mode='allowlist' is not supported by EnvironmentType.DOCKER
network_mode  = "public"
# allowed_hosts = [
#   "registry.npmjs.org",
#   "pypi.org",
#   "files.pythonhosted.org",
#   "github.com",
#   "objects.githubusercontent.com",
# ]

env = { APP_PUBLIC_PORT = "4173" }


[verifier]
environment_mode = "shared"
timeout_sec      = 2400.0

env = { DEKU_SKIP_RUBRIC = "1", DEKU_GRADER_MIN_INTERVAL_SEC = "8", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}" }

# ---------------------------------------------------------------------------
# Artifacts -- proves the /app capture stage works even for this tiny task.
# ---------------------------------------------------------------------------
[[artifacts]]
source      = "/app"
destination = "app"
