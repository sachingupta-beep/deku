# Hidden grading checklist for deku/smoke-tip-calculator.
#
# This task exists to prove the pipeline itself works. The workflows below are
# deliberately thin: enough to exercise the browser grader AND the pytest
# grader, not so many that a broken harness burns half an hour before failing.
#
# reward = passing_workflows / total_workflows
# workflow passes iff  passing_substeps / graded_substeps >= 0.90
#                     AND every substep marked `critical` passed.

# ---------------------------------------------------------------- happy paths

- id: page_loads_and_renders_calculator
  purpose: The single-page app loads and shows a bill input and a tip control
  substeps:
    - kind: browser
      do: Open the root URL and verify the page renders a tip calculator with a visible bill amount input and a tip percentage control (slider, buttons, or number input)
    - kind: browser
      do: Verify the page shows three output labels named tip, total, and per person (case-insensitive), and that no computed number is stale before any input has been typed

- id: interactive_calculation_updates_totals
  purpose: Typing a bill and picking a tip updates the tip amount and total live on the page
  substeps:
    - kind: browser
      do: Type 100 into the bill amount input, set the tip percentage to 15, and confirm the tip output shows 15.00 and the total output shows 115.00

- id: api_health_endpoint_reachable
  purpose: /api/health answers 200 so the healthcheck can go green
  substeps:
    - kind: pytest
      test: test_smoke.py::test_health_endpoint_returns_200
      critical: true

- id: api_calculate_basic_bill_and_tip
  purpose: The JSON endpoint returns the exact rounded fields for a normal case
  substeps:
    - kind: pytest
      test: test_smoke.py::test_calculate_basic_returns_exact_shape
      critical: true

- id: api_calculate_split_across_people
  purpose: The JSON endpoint splits the total across the given people count
  substeps:
    - kind: pytest
      test: test_smoke.py::test_calculate_split_returns_per_person
      critical: true

- id: api_invalid_bill_rejected
  purpose: Invalid inputs are rejected with 400 and a JSON error, not a 5xx or a silent 200
  substeps:
    - kind: browser
      do: Type -5 into the bill amount input and confirm a visible validation message appears on the page and the three output numbers do not display a stale computed value
    - kind: pytest
      test: test_smoke.py::test_invalid_bill_returns_400
      critical: true
