schema_version = "1.3"

[task]
name = "ethara/streak-habit-tracker"
version = "1.0.0"
description = "Single-user habit tracker with daily completion marking and streak counts, backed by PocketBase"
authors = []
keywords = ["greenfield", "individual", "typescript", "pocketbase", "habit-tracker"]

# ---------------------------------------------------------------------------
# Deku metadata (PLAN.md 4.1). Harbor treats [metadata] as arbitrary.
# ---------------------------------------------------------------------------
[metadata]
category     = "Greenfield"
sub_category = "individual"
language     = "typescript"
archetype    = "habit-tracker"
variant      = "a"
difficulty   = "easy"             # written by calibration, never by the author

# Difficulty lever (PLAN.md 4.2): "buildplan" is withheld in variant a.
spec_sections_given = [
  "overview",
  "roles",
  "features",
  "flow",
  "uiux",
  "techrequirements",
  "datamodel",
  "constraints",
  "contract",
]

turns_expected  = 80
tokens_expected = 2500000
contributor_id  = "<contributor-id>"
created_at      = "2026-08-03"
canary_present  = true

# Calibration record - filled by the Calibration Engineer, not the author.
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
calibration_date     = ""
openhands_version    = ""
harbor_version       = "0.20.0"

# Service matrix selection (PLAN.md 3.3). Backend slot only -- PocketBase
# supplies persistence AND auth in one binary, so no separate auth slot is needed.
# Every slot listed here must have at least one `critical` pytest substep.
[metadata.services]
backend = "pocketbase"

# ---------------------------------------------------------------------------
# Agent phase
# ---------------------------------------------------------------------------
[agent]
timeout_sec = 18000.0            # 5h - VCB budget (PLAN.md 3.5)

# ---------------------------------------------------------------------------
# Agent environment
# ---------------------------------------------------------------------------
[environment]
os                = "linux"
cpus              = 2             # easy task, smaller footprint than the exemplar
memory_mb         = 4096
storage_mb        = 10240
build_timeout_sec = 900.0

# PLAN.md 3.6 targets no-network with a pre-seeded package cache. Until the
# Phase 2 cache lands this uses the documented allowlist fallback. Egress is
# build-time only: no provider is remote.
# LOCAL-DEV SETTING -- revert to "allowlist" before this task is admitted.
# Docker Desktop's LinuxKit kernel lacks CONFIG_NFT_FIB_INET, so Harbor cannot
# enforce any non-public mode and rejects the task outright. See the same note in
# tasks/calculator/task.toml. Original: network_mode = "allowlist" with
# allowed_hosts as listed below.
#
# allowed_hosts MUST stay commented out while network_mode is "public" -- Harbor
# rejects the pair ("allowed_hosts is only valid when network_mode='allowlist'"),
# and it rejects it by returning False from Task.is_valid_dir(), which makes the
# CLI silently reclassify the directory as a DATASET and fail with the unrelated
# "Either datasets or tasks must be provided." Restore both lines together.
network_mode  = "public"
# allowed_hosts = [
#   "registry.npmjs.org",
#   "pypi.org",
#   "files.pythonhosted.org",
#   "github.com",
#   "objects.githubusercontent.com",
# ]

# Canonical backend-slot vars (PLAN.md 3.4). No admin credential here.
# `${VAR:-default}` resolves from the host, falling back to the sidecar address in
# environment/docker-compose.yaml. That is what makes the task runnable from a
# fresh clone with no host configuration -- the zero-credential rule (PLAN.md 3.3).
env = { APP_PUBLIC_PORT = "4173", BACKEND_URL = "${BACKEND_URL:-http://pocketbase:8090}" }

# Gates verifier start on the app actually being up (PLAN.md 2.1 step 2).
[environment.healthcheck]
command            = "curl -fsS http://pocketbase:8090/api/health > /dev/null"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

# ---------------------------------------------------------------------------
# Verifier - separate environment keeps workflows.yaml and grader code out of
# the agent's reach (PLAN.md 2.1, 4.7).
# ---------------------------------------------------------------------------
[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0

# BACKEND_ADMIN_KEY is the privileged escape hatch and lives here ONLY
# (PLAN.md 3.4). An agent holding it can satisfy workflows by writing rows
# directly instead of implementing the feature.
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", BACKEND_URL = "${BACKEND_URL:-http://pocketbase:8090}", BACKEND_ADMIN_KEY = "${BACKEND_ADMIN_KEY:-admin@ethara.ai:deku-local-dev}", DEKU_SERVICE_BACKEND = "pocketbase" }

# ---------------------------------------------------------------------------
# Artifacts - collected after the agent phase and before the verifier runs,
# so the agent's built source is preserved even when the verifier fails.
# Lets a human inspect exactly what the agent wrote.
# ---------------------------------------------------------------------------
[[artifacts]]
source      = "/app"
destination = "app"

