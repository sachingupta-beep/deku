# Sidecar services for the `backend` (postgres) and `auth` (keycloak) slots.
#
# Harbor merges this over its own build compose. The agent container is the
# `main` service; services here share its network namespace so the app reaches
# Postgres at `postgres:5432` and Keycloak at `keycloak:8080`.
#
# Zero-credential rule (PLAN.md 3.3): all credentials are fixed local fixture
# values created at container boot. Nothing is fetched from a vendor, nothing
# expires, and a fresh clone plus Docker is sufficient to run the task offline.
#
# Privilege separation (PLAN.md 3.4):
#   - Postgres: unprivileged `deku_app` role for the agent; `deku_admin`
#     (superuser) stays verifier-only. An agent holding the superuser credential
#     could satisfy workflows by writing rows directly.
#   - Keycloak: the `ethara` realm is imported at container boot from
#     keycloak-realm.json, so the agent never needs admin credentials and cannot
#     be handed AUTH_ADMIN_TOKEN. The agent reads AUTH_ISSUER_URL,
#     AUTH_CLIENT_ID and AUTH_CLIENT_SECRET -- enough to exchange OIDC codes
#     and validate tokens, not enough to manage the realm.
#
# arm64 note: quay.io/keycloak/keycloak 21+ ships a multi-arch manifest that
# includes linux/arm64, so this runs natively on Apple Silicon without
# emulation. postgres:16-alpine is similarly multi-arch.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deku_admin
      POSTGRES_PASSWORD: deku-local-dev
      POSTGRES_DB: ethara
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deku_admin -d ethara"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  keycloak:
    # Keycloak 25.0.6 — explicit patch tag, multi-arch (linux/amd64 + linux/arm64).
    # start-dev uses the embedded H2 database so there is no schema conflict with
    # the application's postgres tables. H2 state is ephemeral, but the realm is
    # re-imported from keycloak-realm.json on every boot -- deterministic by design.
    image: quay.io/keycloak/keycloak:25.0.6
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: deku_admin
      KEYCLOAK_ADMIN_PASSWORD: deku-local-dev
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/ethara-realm.json:ro
    ports:
      # 8080: main HTTP; 9000: management (health/ready endpoint).
      - "8080:8080"
      - "9000:9000"
    healthcheck:
      # Keycloak 25 UBI image ships no curl/wget. Use bash /dev/tcp on the
      # management port (9000) which exposes /health/ready. The realm import
      # is complete once the token endpoint path appears in the response body.
      # Using the management port is the officially supported way to health-check
      # Keycloak in containerised environments.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 5 cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 90s

  # Harbor's agent container. Only the port binding is declared here; Harbor
  # controls everything else (image, build, env injection, etc.).
  main:
    # Ports only (plus depends_on where useful). Harbor merges this file LAST, so
    # anything here overrides its own definition of `main`. Never add `image:`,
    # `command:` or `profiles:` -- an image/command replaces the built agent and
    # its entrypoint, and a profile makes compose skip the service entirely, so
    # the agent would never start. Bring sidecars up standalone with `docker run`
    # for local checks instead of stubbing `main`.
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "4173:4173"
