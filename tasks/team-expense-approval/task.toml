schema_version = "1.3"

[task]
name = "ethara/team-expense-approval"
version = "1.0.0"
description = "Three-role expense claim approval workflow with OIDC auth"
authors = []
keywords = ["greenfield", "enterprise", "typescript", "python", "rbac", "postgres", "keycloak", "oidc"]

# ---------------------------------------------------------------------------
# Deku metadata (PLAN.md 4.1). Harbor treats [metadata] as arbitrary.
# ---------------------------------------------------------------------------
[metadata]
category     = "Greenfield"
sub_category = "enterprise"
language     = "typescript"
archetype    = "expense-approval"
variant      = "a"
difficulty   = "hard"             # written by calibration, never by the author

# Difficulty lever (PLAN.md 4.2): "buildplan" is withheld in variant a.
spec_sections_given = [
  "overview",
  "roles",
  "features",
  "flow",
  "uiux",
  "constraints",
  "contract",
  "techrequirements",
  "datamodel",
]

turns_expected  = 180
tokens_expected = 6500000
contributor_id  = "<contributor-id>"
created_at      = "2026-08-03"
canary_present  = true

# Calibration record - filled by the Calibration Engineer, not the author.
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
calibration_date     = ""
openhands_version    = ""
harbor_version       = "0.20.0"

# Service matrix selection (PLAN.md 3.3). One provider per slot the task needs.
# Every slot listed here must have at least one `critical` pytest substep.
# Keycloak is a real OIDC provider -- redirect-flow authentication, not a
# password-in-a-DB shortcut. It is credential-free and self-bootstrapping.
[metadata.services]
backend = "postgres"
auth    = "keycloak"

# ---------------------------------------------------------------------------
# Agent phase
# ---------------------------------------------------------------------------
[agent]
timeout_sec = 18000.0             # 5h - VCB budget (PLAN.md 3.5)

# ---------------------------------------------------------------------------
# Agent environment
# ---------------------------------------------------------------------------
[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0

# PLAN.md 3.6 targets no-network with a pre-seeded package cache. Until the
# Phase 2 cache lands this uses the documented allowlist fallback. Egress is
# build-time only: both PostgreSQL and Keycloak are sidecar containers.
# LOCAL-DEV SETTING -- revert to "allowlist" before admission. Docker Desktop's
# LinuxKit kernel lacks CONFIG_NFT_FIB_INET, so Harbor cannot enforce any
# non-public policy and rejects the task before the agent starts:
#   ValueError: network_mode='allowlist' is not supported by EnvironmentType.DOCKER
network_mode  = "public"
# allowed_hosts = [
#   "registry.npmjs.org",
#   "pypi.org",
#   "files.pythonhosted.org",
#   "github.com",
#   "objects.githubusercontent.com",
# ]

# Canonical env for both slots (PLAN.md 3.4). AUTH_CLIENT_SECRET is the client
# credential the app uses to complete the OIDC code exchange; it is NOT the
# admin token. The admin token is verifier-only, below.
env = { APP_PUBLIC_PORT = "4173", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/ethara}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/ethara}", AUTH_ISSUER_URL = "${AUTH_ISSUER_URL:-http://keycloak:8080/realms/ethara}", AUTH_CLIENT_ID = "${AUTH_CLIENT_ID:-ethara-app}", AUTH_CLIENT_SECRET = "${AUTH_CLIENT_SECRET:-ethara-secret-2026}" }

# Gates verifier start on the app actually being up (PLAN.md 2.1 step 2).
[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

# ---------------------------------------------------------------------------
# Verifier - separate environment keeps workflows.yaml and grader code out of
# the agent's reach (PLAN.md 2.1, 4.7). Reachability to the agent's app is the
# Phase 0 spike in PLAN.md 1.8.
# ---------------------------------------------------------------------------
[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0

# PLAN.md 3.4: the privileged per-slot credentials live here ONLY. An agent
# holding DB_ADMIN_URL can satisfy workflows by writing rows directly, and an
# agent holding AUTH_ADMIN_TOKEN can issue tokens for any user. Both are the
# highest-value exploits in this task and both are verifier-side.
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/ethara}", AUTH_ADMIN_TOKEN = "${AUTH_ADMIN_TOKEN:-deku_admin:deku-local-dev}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_AUTH = "keycloak" }

# ---------------------------------------------------------------------------
# Artifacts - collected after the agent phase and before the verifier runs,
# so the agent's built source is preserved even when the verifier fails.
# Lets a human inspect exactly what the agent wrote.
# ---------------------------------------------------------------------------
[[artifacts]]
source      = "/app"
destination = "app"

