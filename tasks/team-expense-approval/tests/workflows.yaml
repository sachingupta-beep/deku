# Hidden grading checklist (PLAN.md 4.4).
#
# Baked into the verifier image and NEVER uploaded to the agent container --
# [verifier].environment_mode = "separate" in task.toml is what guarantees that.
#
# A workflow passes iff  passing_substeps / total_substeps >= 0.90
#                        AND every substep marked `critical` passed.
# reward = passing_workflows / total_workflows.
#
# This task exercises a THREE-ROLE PERMISSION HIERARCHY -- employee, manager,
# finance -- plus real OIDC redirect-flow auth. Permission and data-isolation
# assertions are always `pytest` and always `critical`: hiding a button is not
# authorization (PLAN.md 4.7).

# ---------------------------------------------------------------- happy paths

- id: employee_submits_claim
  purpose: An employee submits a well-formed claim and sees it appear in their history
  substeps:
    - kind: browser
      do: Sign in with the employee credentials for Ellen documented in /app/USER_README.md
    - kind: browser
      do: Open /claims/new and submit a meals claim for $12.50 with a description
    - kind: browser
      do: Verify the new claim appears in /claims/mine with state Submitted
    - kind: pytest
      test: test_state_machine.py::test_submit_claim_persisted
      critical: true

- id: manager_approves_report_claim
  purpose: A manager approves a submitted claim from one of their direct reports
  substeps:
    - kind: browser
      do: Sign in as manager Mia and open the approval queue at /queue
    - kind: browser
      do: Verify Ellen's submitted claim appears in the queue with amount and category
    - kind: browser
      do: Approve the claim inline and verify a success confirmation
    - kind: pytest
      test: test_state_machine.py::test_manager_approves_report_claim_persisted
      critical: true

- id: manager_rejects_with_reason
  purpose: A manager rejects a submitted claim and the reason is persisted
  substeps:
    - kind: browser
      do: Sign in as manager Mia and open a submitted claim from Ellen
    - kind: browser
      do: Reject the claim, provide a reason, and confirm in the destructive dialog
    - kind: browser
      do: Verify the claim shows state Rejected with the reason visible
    - kind: pytest
      test: test_state_machine.py::test_manager_rejects_with_reason_persisted
      critical: true

- id: finance_marks_approved_reimbursed
  purpose: Finance moves an approved claim to reimbursed
  substeps:
    - kind: browser
      do: Sign in as finance and open /reimburse
    - kind: browser
      do: Mark an approved claim as reimbursed and verify a success confirmation
    - kind: browser
      do: Verify the claim is no longer in the reimbursement queue
    - kind: pytest
      test: test_state_machine.py::test_finance_reimburses_approved_persisted
      critical: true

- id: dashboards_match_reality
  purpose: Each role's dashboard tiles reflect true database state, not invented numbers
  substeps:
    - kind: browser
      do: Sign in as manager Mia and open the dashboard
    - kind: browser
      do: Verify a pending-approvals tile is present and the number is a real integer
    - kind: pytest
      test: test_data_integrity.py::test_manager_dashboard_matches_database
      critical: true
    - kind: pytest
      test: test_data_integrity.py::test_finance_dashboard_matches_database
      critical: true

# ------------------------------------------------------ permission boundaries

- id: employee_approve_denied
  purpose: An employee cannot approve any claim, even by direct API call
  substeps:
    - kind: browser
      do: Sign in as employee Ellen
    - kind: browser
      do: Verify no approve or reject control is visible anywhere in the app
    - kind: pytest
      test: test_rbac.py::test_employee_approve_denied_at_api
      critical: true
    - kind: pytest
      test: test_rbac.py::test_employee_reimburse_denied_at_api
      critical: true

- id: manager_cross_team_approval_forbidden
  purpose: A manager cannot approve a claim from another manager's report
  substeps:
    - kind: browser
      do: Sign in as manager Mia and confirm the queue shows only her direct reports
    - kind: pytest
      test: test_rbac.py::test_manager_cannot_approve_other_managers_report
      critical: true
    - kind: pytest
      test: test_rbac.py::test_manager_cannot_reject_other_managers_report
      critical: true

- id: employee_cannot_read_others_claims
  purpose: An employee cannot read another employee's claim or see it in lists
  substeps:
    - kind: pytest
      test: test_rbac.py::test_employee_cannot_read_other_employees_claim
      critical: true
    - kind: pytest
      test: test_rbac.py::test_employee_list_excludes_other_employees_claims
      critical: true

- id: finance_cannot_approve
  purpose: Finance can settle approved claims but cannot approve or reject
  substeps:
    - kind: pytest
      test: test_rbac.py::test_finance_approve_denied_at_api
      critical: true
    - kind: pytest
      test: test_rbac.py::test_finance_reject_denied_at_api
      critical: true

- id: unauthenticated_access_denied
  purpose: Every mutating endpoint rejects anonymous callers
  substeps:
    - kind: browser
      do: Open /queue without signing in and verify a redirect to the login page
    - kind: pytest
      test: test_rbac.py::test_unauthenticated_requests_denied
      critical: true

# ------------------------------------------------- state-machine invariants

- id: approved_claim_cannot_be_approved_twice
  purpose: A claim already approved cannot be approved again
  substeps:
    - kind: pytest
      test: test_state_machine.py::test_double_approve_conflict
      critical: true

- id: rejected_claim_cannot_be_reimbursed
  purpose: A rejected claim can never become reimbursed
  substeps:
    - kind: pytest
      test: test_state_machine.py::test_rejected_cannot_be_reimbursed
      critical: true

- id: submitted_claim_cannot_be_reimbursed
  purpose: Finance cannot skip approval - only approved claims may be reimbursed
  substeps:
    - kind: pytest
      test: test_state_machine.py::test_submitted_cannot_be_reimbursed
      critical: true

# ------------------------------------------------------- validation and empty

- id: invalid_amount_rejected
  purpose: Zero and negative amounts are rejected at the API
  substeps:
    - kind: browser
      do: Sign in as employee Ellen and open /claims/new
    - kind: browser
      do: Submit a claim with amount zero and verify a validation error is shown
    - kind: pytest
      test: test_state_machine.py::test_zero_amount_rejected
    - kind: pytest
      test: test_state_machine.py::test_negative_amount_rejected

- id: empty_queue_for_lonely_manager
  purpose: A manager with no pending claims sees an empty state, not a crash
  substeps:
    - kind: browser
      do: Sign in as manager Mark and open /queue
    - kind: pytest
      test: test_data_integrity.py::test_manager_queue_scope_matches_database
      critical: true
